name: Watch pages whose wording this site depends on

# The link checker proves a cited URL still resolves. This asks the harder
# question: does the page still SAY what we told readers it says?
#
# Both times this project published something wrong, the cause was the same —
# a German government page kept its address and changed its text. A reader
# acting on the old wording can lose an exam fee and several months.
#
# Runs daily rather than weekly. The open question it exists for right now is
# whether the embassy adds ECL to its list of accepted language providers, and
# a student deciding whether to book an exam should not wait up to a week to
# find out.
#
# Separate from deploy, like the link checker: a slow foreign ministry website
# must never be able to stop this site publishing.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no commits. If
# this goes quiet, that is usually why — push a commit or press "Run workflow".

on:
  schedule:
    # 07:15 UTC daily, just after the Monday link check.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: page-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci: the watcher uses only the Node standard library, and a
      # dependency install is a failure mode this does not need.
      - name: Check watched pages
        id: watch
        run: node scripts/check-watch.mjs --report watch-report.md

      - name: Read the report
        if: always()
        id: report
        run: |
          {
            echo 'body<<REPORT_EOF'
            cat watch-report.md 2>/dev/null || echo "The watcher did not finish. See the workflow log."
            echo ''
            echo "_Checked by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on $(date -u '+%d %B %Y')._"
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"

      # A wording change is news, not noise: it means a page here is now either
      # wrong or newly provable. Either way somebody has to read it.
      - name: Open or update the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "A watched page has changed its wording";
            const body = process.env.REPORT;
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "page-changed", per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number,
                body: "Still changed.\n\n" + body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["page-changed"],
              });
            }
        env:
          REPORT: ${{ steps.report.outputs.body }}

      # Closing is done by hand here, unlike the link checker. A link that works
      # again is fixed; a page that changed its wording is only "fixed" once a
      # human has read it and updated the claim, SOURCES.md and the watch list.
